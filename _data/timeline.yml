# - date: "Year 12, Harvest"
#   event: "The Fall of the Eastern Gate"
#   summary: "Raiders broke the eastern wall during the harvest festival."
#   link: "/locations-and-landmarks/"
#   current: true marks the age the story is in now (optional)
#   tag:     a short label shown beside the date, e.g. "Start of server" (optional)

