# Generated by .github/scripts/submissions.py. Edit TYPES there, then run:
#   python3 .github/scripts/submissions.py forms
name: "Character"
description: "Add your approved character to the Character Gallery."
title: "[Character] "
labels: ["submission", "submission:character"]
body:
  - type: markdown
    attributes:
      value: |
        **Everything here is public.** Only share what any player is allowed to know: no secrets or staff spoilers.
        Staff review every submission. Once approved, it is added to the wiki and this issue is closed.
  - type: input
    id: f0
    attributes:
      label: "Character name"
      description: "e.g. Aster Vale"
    validations:
      required: true
  - type: dropdown
    id: f1
    attributes:
      label: "Character type"
      options:
        - "Player Character"
        - "Staff Character"
        - "Important NPC"
    validations:
      required: true
  - type: dropdown
    id: f2
    attributes:
      label: "Status"
      options:
        - "Alive"
        - "Dead"
        - "Retired"
        - "Unknown"
    validations:
      required: true
  - type: input
    id: f3
    attributes:
      label: "Known for"
      description: "Their public reputation in one sentence"
    validations:
      required: false
  - type: input
    id: f4
    attributes:
      label: "Affiliations"
      description: "Nations, factions, faiths or jobs, separated by commas"
    validations:
      required: false
  - type: input
    id: f5
    attributes:
      label: "Race or ancestry"
    validations:
      required: false
  - type: input
    id: f6
    attributes:
      label: "Current whereabouts"
      description: "Where they can usually be found"
    validations:
      required: false
  - type: input
    id: f7
    attributes:
      label: "Played by"
      description: "Your Minecraft or Discord name"
    validations:
      required: true
  - type: textarea
    id: f8
    attributes:
      label: "Character art"
      description: "Drag and drop a picture here (PNG or JPG)"
    validations:
      required: false
  - type: input
    id: f9
    attributes:
      label: "Art by"
      description: "Who drew the art. Only submit art you have permission to use."
    validations:
      required: false
  - type: textarea
    id: f10
    attributes:
      label: "Bonds"
      description: "One per line: Name | Relation | Type\nType is Family, Ally, Rival, Romance or Other.\nExample: Bram Vale | Older brother | Family"
    validations:
      required: false
  - type: textarea
    id: f11
    attributes:
      label: "Background"
      description: "Their public background. Public knowledge only, never secrets."
    validations:
      required: false
