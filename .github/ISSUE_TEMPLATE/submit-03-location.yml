name: "Location"
description: "A city, ruin, dungeon, landmark or other place."
title: "[Location] "
labels: ["submission", "submission:location"]
body:
  - type: markdown
    attributes:
      value: |
        **Everything here is public.** Only share what any player is allowed to know: no secrets or staff spoilers.
        Staff review every submission. Once approved, it is added to the wiki and this issue is closed.
  - type: input
    id: update
    attributes:
      label: "Updating an existing page?"
      description: "Leave this empty for a new page. To update a page, paste its address (e.g. https://smpequinox.github.io/characters/swobble/) or its exact name, then fill in only what changes: empty boxes keep the current info, and new bonds are added to the existing ones. To remove something, write a single - in its box; to remove a bond, write: Name | remove"
    validations:
      required: false
  - type: input
    id: f0
    attributes:
      label: "Location name"
    validations:
      required: true
  - type: dropdown
    id: f1
    attributes:
      label: "Kind of place"
      options:
        - "Capital"
        - "City"
        - "Town"
        - "Village"
        - "Fort"
        - "Port"
        - "Landmark"
        - "Ruin"
        - "Other"
    validations:
      required: false
  - type: dropdown
    id: f2
    attributes:
      label: "Region"
      options:
        - "North"
        - "Northeast"
        - "East"
        - "Southeast"
        - "South"
        - "Southwest"
        - "West"
        - "Northwest"
        - "Central"
        - "Not sure"
    validations:
      required: false
  - type: input
    id: f3
    attributes:
      label: "Summary"
      description: "One line a new player should understand"
    validations:
      required: true
  - type: input
    id: f4
    attributes:
      label: "Type of place"
      description: "A short description, e.g. walled port city, mountain fortress"
    validations:
      required: false
  - type: input
    id: f5
    attributes:
      label: "Controlled by"
      description: "Nation, faction or house. Naming a nation lists this place in its chart."
    validations:
      required: false
  - type: input
    id: f6
    attributes:
      label: "Known for"
    validations:
      required: false
  - type: textarea
    id: f7
    attributes:
      label: "Description"
      description: "History, points of interest, anything public"
    validations:
      required: false
