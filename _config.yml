# ─────────────────────────────────────────────────────────────
#  EQUINOX SMP — SITE SETTINGS
#  Change the values on the right side of the colon.
#  Keep the quotation marks. After saving, the site updates in ~1 minute.
# ─────────────────────────────────────────────────────────────

title: "Equinox SMP"
tagline: "A Living Archive of the Equinox World"
description: "The public wiki for Equinox SMP: rules, world lore, characters, and the unfolding story of a Minecraft roleplay server."

# Server details shown in the purple box on the home page
minecraft_version: "1.21.11"
server_address: "equinoxsmp.kinetic.host"   # leave as "" to hide it
application_url: "https://docs.google.com/forms/d/e/1FAIpQLSfwPFXMHKCIY7TYrILYH1gYLXKXWcwUL-7Ji-aFT25rrLyZXA/viewform"
discord_url: "https://discord.gg/gAXSsrGtDv"
# Where players submit characters, theories and lore (GitHub issue forms)
submit_url: "https://github.com/smpequinox/smpequinox.github.io/issues/new/choose"

# The story arc currently running
current_arc: "Inter-Arc: Remember the Forgotten"

# The in-world calendar. The Timeline page counts forward from this point
# to show the current in-world month and year. To correct the date, set
# start_date to today's real date and start_month / start_year to the
# in-world date right now (start_month: 1 = Janument ... 12 = Decrimar).
calendar:
  era: "S.R"
  start_date: "2026-10-19"
  start_month: 2
  start_year: 751
  days_per_month: 10.1458   # real days per in-world month (3 in-world years = 1 real year)

# Leave these alone unless the site moves to a different address
url: ""
baseurl: ""

# ─────────────────────────────────────────────────────────────
#  Technical settings below — no need to touch these
# ─────────────────────────────────────────────────────────────
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

collections:
  lore:
    output: true
    permalink: /lore/:name/
  characters:
    output: true
    permalink: /characters/:name/

defaults:
  - scope: { path: "", type: pages }
    values: { layout: page }
  - scope: { path: "", type: lore }
    values: { layout: lore-entry }
  - scope: { path: "", type: characters }
    values: { layout: character }

exclude:
  - EDITING.md
  - README.md
  - templates
  - Gemfile
  - Gemfile.lock
