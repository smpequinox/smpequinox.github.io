# When staff add the "approved" label to a submission issue, write the wiki page
# and open a pull request for it. Staff review and merge the pull request.
name: Approved submission
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: submission-${{ github.event.issue.number }}
jobs:
  add-to-wiki:
    if: github.event.label.name == 'approved' && contains(join(github.event.issue.labels.*.name, ','), 'submission:')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Write the wiki page
        env:
          ISSUE_JSON: ${{ toJSON(github.event.issue) }}
        run: |
          printf '%s' "$ISSUE_JSON" > "$RUNNER_TEMP/issue.json"
          python3 .github/scripts/submissions.py build "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/result.json" 2> "$RUNNER_TEMP/error.txt" || { cat "$RUNNER_TEMP/error.txt"; exit 1; }
          cat "$RUNNER_TEMP/result.json"
      - name: Open a pull request
        run: |
          type=$(jq -r .type "$RUNNER_TEMP/result.json")
          action=$(jq -r .action "$RUNNER_TEMP/result.json")
          title=$(jq -r .title "$RUNNER_TEMP/result.json")
          files=$(jq -r '.files[] | "- `" + . + "`"' "$RUNNER_TEMP/result.json")
          branch="submission/issue-$NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "$action $type: $title" -m "From submission #$NUMBER"
          git push --force origin "$branch"
          if [ "$action" = "Update" ]; then
            what=$(printf 'Updates the %s **%s** with the changes from #%s. Boxes the player left empty keep their current info, new bonds are added, and anything they marked with - is removed. Check the changes below.' "$type" "$title" "$NUMBER")
          else
            what=$(printf 'Adds the %s **%s** from #%s.' "$type" "$title" "$NUMBER")
          fi
          body=$(printf '%s\n\nFiles:\n%s\n\nCheck the page reads well, then merge to publish it.\n\nCloses #%s' "$what" "$files" "$NUMBER")
          url=$(gh pr view "$branch" --json url -q .url 2>/dev/null || gh pr create --base "$BASE" --head "$branch" --title "$action $type: $title" --body "$body")
          gh issue comment "$NUMBER" --body "Approved! The wiki page is ready for a final check in $url. It goes live once that pull request is merged."
      - name: Report a problem
        if: failure()
        run: |
          reason=$(grep -h "Error" "$RUNNER_TEMP/error.txt" 2>/dev/null | tail -n 1 | sed 's/^[A-Za-z]*Error: //')
          gh issue comment "$NUMBER" --body "$(printf 'This submission could not be turned into a wiki page automatically.\n\n%s\n\nStaff: fix the issue (or ask the player to edit it), then remove and re-add the **approved** label. Run log: %s' "${reason:-See the run log for details.}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
